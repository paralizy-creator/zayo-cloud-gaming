
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zayo Cloud Gaming</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080b18;color:white;font-family:Arial,sans-serif}
header{padding:25px;text-align:center;background:linear-gradient(120deg,#111b45,#32105d)}
h1{color:#65d8ff;margin:5px}
main{max-width:900px;margin:auto;padding:18px}
h2{color:#65d8ff}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}
.card{background:#151b32;border:1px solid #29365e;border-radius:15px;padding:18px}
button{background:#1769ff;color:white;border:0;padding:12px 18px;border-radius:9px;font-weight:bold;margin:5px;cursor:pointer}
button:hover{background:#4385ff}
#game{display:none;text-align:center;background:#11182c;padding:15px;border-radius:15px;margin-top:20px}
canvas{background:#050914;border:2px solid #4169ff;border-radius:10px;max-width:100%;touch-action:none}
#score{font-size:20px;color:#65d8ff}
footer{text-align:center;color:#888;padding:25px}
</style>
</head>
<body>
<header>
<h1>🎮 ZAYO CLOUD GAMING</h1>
<p>Sua diversão começa aqui!</p>
</header>
<main>
<h2>Biblioteca de jogos</h2>
<div class="games">
<div class="card">
<h3>⚡ Reflexo Zayo</h3>
<p>Teste sua velocidade e seus reflexos.</p>
<button onclick="start('reflexo')">Jogar agora</button>
</div>
<div class="card">
<h3>🐍 Cobrinha Neon</h3>
<p>Controle a cobrinha e consiga pontos.</p>
<button onclick="start('cobra')">Jogar agora</button>
</div>
<div class="card">
<h3>🧠 Memória Zayo</h3>
<p>Encontre os pares de cartas.</p>
<button onclick="start('memoria')">Jogar agora</button>
</div>
</div>
<div id="game">
<h2 id="gameTitle">Jogo</h2>
<div id="score"></div>
<canvas id="canvas" width="320" height="320"></canvas>
<div id="controls"></div>
<button onclick="start(current)">Reiniciar</button>
<button onclick="closeGame()">Voltar</button>
</div>
</main>
<footer>Zayo Cloud Gaming © 2026</footer>
<script>
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const panel=document.getElementById("game");
let current="",timer=null,score=0,snake=[],food={},dir={x:1,y:0},cards=[],chosen=[],locked=false;

function start(type){
clearInterval(timer);
current=type;score=0;
panel.style.display="block";
document.getElementById("controls").innerHTML="";
document.getElementById("score").textContent="";
if(type==="reflexo") reflexo();
if(type==="cobra") cobra();
if(type==="memoria") memoria();
}
function closeGame(){
clearInterval(timer);panel.style.display="none";
}
function reflexo(){
document.getElementById("gameTitle").textContent="⚡ Reflexo Zayo";
let waiting=true,ready=false;
ctx.fillStyle="#050914";ctx.fillRect(0,0,320,320);
ctx.fillStyle="white";ctx.font="20px Arial";
ctx.fillText("Toque para começar",75,150);
canvas.onclick=()=>{
if(waiting){
waiting=false;
ctx.fillStyle="#050914";ctx.fillRect(0,0,320,320);
ctx.fillStyle="yellow";ctx.font="25px Arial";
ctx.fillText("AGUARDE...",95,160);
let delay=1000+Math.random()*3000;
timer=setTimeout(()=>{
ready=true;
ctx.fillStyle="#00dd77";ctx.fillRect(0,0,320,320);
ctx.fillStyle="black";ctx.fillText("TOQUE AGORA!",75,165);
},delay);
}else if(ready){
let elapsed=Date.now()-begin;
document.getElementById("score").textContent="Seu tempo: "+elapsed+" ms";
ready=false;waiting=true;
}else{
clearTimeout(timer);
document.getElementById("score").textContent="Muito cedo! Tente novamente.";
waiting=true;
}
};
let begin=Date.now();
let original=canvas.onclick;
canvas.onclick=()=>{
if(waiting&&!ready){
waiting=false;
ctx.fillStyle="#050914";ctx.fillRect(0,0,320,320);
ctx.fillStyle="yellow";ctx.font="25px Arial";ctx.fillText("AGUARDE...",95,160);
timer=setTimeout(()=>{
ready=true;begin=Date.now();
ctx.fillStyle="#00dd77";ctx.fillRect(0,0,320,320);
ctx.fillStyle="black";ctx.fillText("TOQUE AGORA!",75,165);
},1000+Math.random()*3000);
}else if(ready){
document.getElementById("score").textContent="Seu tempo: "+(Date.now()-begin)+" ms";
ready=false;waiting=true;
}else{
clearTimeout(timer);waiting=true;
document.getElementById("score").textContent="Você clicou cedo! Tente novamente.";
}
};
}
function cobra(){
document.getElementById("gameTitle").textContent="🐍 Cobrinha Neon";
snake=[{x:8,y:8},{x:7,y:8},{x:6,y:8}];
dir={x:1,y:0};food={x:14,y:12};
canvas.onclick=null;
document.getElementById("controls").innerHTML=
'<button onclick="turn(0,-1)">⬆️</button><br>'+
'<button onclick="turn(-1,0)">⬅️</button>'+
'<button onclick="turn(0,1)">⬇️</button>'+
'<button onclick="turn(1,0)">➡️</button>';
timer=setInterval(()=>{
let head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
if(head.x<0||head.x>=16||head.y<0||head.y>=16||snake.some(s=>s.x===head.x&&s.y===head.y)){
clearInterval(timer);document.getElementById("score").textContent="Fim de jogo! Pontos: "+score;return;
}
snake.unshift(head);
if(head.x===food.x&&head.y===food.y){
score++;food={x:Math.floor(Math.random()*16),y:Math.floor(Math.random()*16)};
}else snake.pop();
drawSnake();
document.getElementById("score").textContent="Pontos: "+score;
},160);
}
function turn(x,y){if(x!==-dir.x||y!==-dir.y)dir={x,y}}
document.onkeydown=e=>{
if(current==="cobra"){
if(e.key==="ArrowUp")turn(0,-1);
if(e.key==="ArrowDown")turn(0,1);
if(e.key==="ArrowLeft")turn(-1,0);
if(e.key==="ArrowRight")turn(1,0);
}
};
function drawSnake(){
ctx.fillStyle="#050914";ctx.fillRect(0,0,320,320);
ctx.fillStyle="#00ff9d";
snake.forEach(s=>ctx.fillRect(s.x*20+1,s.y*20+1,18,18));
ctx.fillStyle="#ff3860";ctx.fillRect(food.x*20+2,food.y*20+2,16,16);
}
function memoria(){
document.getElementById("gameTitle").textContent="🧠 Memória Zayo";
canvas.onclick=null;
let symbols=["🚀","🎮","⭐","🐉","🔥","💎","🚀","🎮","⭐","🐉","🔥","💎"];
cards=symbols.sort(()=>Math.random()-.5);
chosen=[];locked=false;score=0;
let html='<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px">';
cards.forEach((c,i)=>{
html+=`<button id="c${i}" style="height:65px;font-size:23px" onclick="flip(${i})">?</button>`;
});
document.getElementById("controls").innerHTML=html+"</div>";
ctx.clearRect(0,0,320,320);
document.getElementById("score").textContent="Encontre os pares!";
}
function flip(i){
if(locked||chosen.includes(i)||document.getElementById("c"+i).textContent!=="?")return;
document.getElementById("c"+i).textContent=cards[i];
chosen.push(i);
if(chosen.length===2){
locked=true;
if(cards[chosen[0]]===cards[chosen[1]]){
score++;chosen=[];locked=false;
document.getElementById("score").textContent="Pares encontrados: "+score;
if(score===6)document.getElementById("score").textContent="🏆 Você venceu!";
}else{
setTimeout(()=>{
chosen.forEach(n=>document.getElementById("c"+n).textContent="?");
chosen=[];locked=false;
},800);
}
}
}
</script>
</body>
</html>
